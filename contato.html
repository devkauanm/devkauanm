<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contato // Kauan Martins</title>

  <meta
    name="description"
    content="Entre em contato com Kauan Martins através do formulário."
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080714;
      --bg-secondary: #0f0d1f;
      --card: rgba(18, 15, 39, 0.82);
      --border: rgba(0, 255, 242, 0.22);
      --cyan: #00fff2;
      --purple: #8b5cf6;
      --purple-light: #a78bfa;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --error: #ff5c8a;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(139, 92, 246, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(0, 255, 242, 0.12),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );
    }

    .container {
      width: 100%;
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    .terminal {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--card);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 0 50px rgba(0, 255, 242, 0.06),
        0 0 90px rgba(139, 92, 246, 0.08);
    }

    .terminal-bar {
      height: 46px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

      background: rgba(255, 255, 255, 0.025);
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #3f3f46;
    }

    .terminal-title {
      margin-left: auto;
      margin-right: auto;

      font-family: monospace;
      font-size: 12px;

      color: #71717a;
    }

    .content {
      padding: 42px;
    }

    .eyebrow {
      margin-bottom: 12px;

      font-family: monospace;
      font-size: 14px;
      letter-spacing: 1px;

      color: var(--cyan);
    }

    h1 {
      margin-bottom: 14px;

      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.05;

      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--purple-light)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro {
      max-width: 620px;

      margin-bottom: 32px;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-family: monospace;
      font-size: 13px;

      color: var(--purple-light);
    }

    input,
    textarea {
      width: 100%;

      padding: 14px 16px;

      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 10px;

      outline: none;

      color: var(--text);
      background: rgba(5, 4, 15, 0.72);

      font-family: inherit;
      font-size: 15px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #52525b;
    }

    input:focus,
    textarea:focus {
      border-color: var(--cyan);

      box-shadow:
        0 0 0 3px rgba(0, 255, 242, 0.08),
        0 0 20px rgba(0, 255, 242, 0.05);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;

      margin-top: 8px;
      padding: 15px 20px;

      border: 0;
      border-radius: 10px;

      cursor: pointer;

      color: #05050a;

      background: linear-gradient(
        90deg,
        var(--cyan),
        #62fff7
      );

      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 30px rgba(0, 255, 242, 0.18);
    }

    .submit-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .status {
      display: none;

      margin-top: 20px;
      padding: 14px 16px;

      border-radius: 10px;

      font-size: 14px;
      line-height: 1.5;
    }

    .status.success {
      display: block;

      border: 1px solid rgba(0, 255, 242, 0.25);

      color: var(--cyan);
      background: rgba(0, 255, 242, 0.06);
    }

    .status.error {
      display: block;

      border: 1px solid rgba(255, 92, 138, 0.25);

      color: var(--error);
      background: rgba(255, 92, 138, 0.06);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      margin-top: 32px;
      padding-top: 24px;

      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .footer span {
      color: #71717a;
      font-family: monospace;
      font-size: 12px;
    }

    .linkedin {
      color: var(--cyan);
      text-decoration: none;

      font-family: monospace;
      font-size: 13px;

      transition: color 0.2s ease;
    }

    .linkedin:hover {
      color: white;
    }

    .back {
      display: inline-block;

      margin-top: 24px;

      color: #71717a;

      font-family: monospace;
      font-size: 12px;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .back:hover {
      color: var(--cyan);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .content {
        padding: 28px 20px;
      }

      .terminal-bar {
        padding: 0 14px;
      }

      .terminal-title {
        font-size: 10px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="terminal">

      <div class="terminal-bar">
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <div class="terminal-title">
          kauan@dev:~/contact
        </div>
      </div>

      <div class="content">

        <div class="eyebrow">
          &gt; CONNECTION_REQUEST
        </div>

        <h1>Entre em contato.</h1>

        <p class="intro">
          Tem um projeto, oportunidade ou ideia que gostaria de conversar?
          Envie uma mensagem. Ela chegará diretamente para mim.
        </p>

        <form id="contact-form">

          <input
            type="hidden"
            name="access_key"
            value="81c150af-7395-4c0a-91b2-d583f67ca290"
          >

          <input
            type="hidden"
            name="subject"
            value="Novo contato através do GitHub - Kauan Martins"
          >

          <input
            type="hidden"
            name="from_name"
            value="Portfólio Kauan Martins"
          >

          <input
            type="checkbox"
            name="botcheck"
            style="display:none"
          >

          <div class="form-group">
            <label for="name">
              // nome
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Como posso te chamar?"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">
              // e-mail
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
            >
          </div>

          <div class="form-group">
            <label for="message">
              // mensagem
            </label>

            <textarea
              id="message"
              name="message"
              placeholder="Escreva sua mensagem..."
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="submit-button"
            id="submit-button"
          >
            &gt; ENVIAR MENSAGEM
          </button>

          <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
          ></div>

        </form>

        <div class="footer">

          <span>
            STATUS: ONLINE
          </span>

          <a
            class="linkedin"
            href="https://www.linkedin.com/in/kauan-martins-6482b62a1"
            target="_blank"
            rel="noopener noreferrer"
          >
            LinkedIn ↗
          </a>

        </div>

        <a
          class="back"
          href="https://github.com/devkauanm"
        >
          ← voltar para o GitHub
        </a>

      </div>

    </section>

  </main>

  <script>
    const form = document.getElementById("contact-form");
    const button = document.getElementById("submit-button");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "> ENVIANDO...";

      status.className = "status";
      status.textContent = "";

      const formData = new FormData(form);

      try {
        const response = await fetch(
          "https://api.web3forms.com/submit",
          {
            method: "POST",
            body: formData
          }
        );

        const data = await response.json();

        if (data.success) {
          status.className = "status success";

          status.innerHTML =
            "✓ Mensagem enviada com sucesso! Obrigado pelo contato.";

          form.reset();

          button.textContent = "> MENSAGEM ENVIADA";
        } else {
          throw new Error(
            data.message || "Não foi possível enviar a mensagem."
          );
        }

      } catch (error) {

        status.className = "status error";

        status.textContent =
          "✕ Não foi possível enviar a mensagem. Tente novamente.";

        button.disabled = false;
        button.textContent = "> ENVIAR MENSAGEM";
      }
    });
  </script>

</body>
</html>
